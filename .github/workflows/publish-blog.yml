name: Publish blog article

on:
  schedule:
    - cron: "0 14 * * 3,5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate and validate article
        id: article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-blog-post.mjs >> "$GITHUB_OUTPUT"

      - name: Commit and publish article
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          ARTICLE_FILE: ${{ steps.article.outputs.file }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$ARTICLE_FILE"
          git commit -m "Publish blog: ${ARTICLE_FILE#content/blog/}"
          git push
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK_URL"
          fi